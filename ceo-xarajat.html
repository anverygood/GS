<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oylik xarajatlar — Qurilish Nazorat</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/qn.css"></head><body><div class="shell"><div id="sidebarSlot"></div><div class="main"><div id="topbarSlot"></div><div class="content"><div class="grid g-4 mb-26" id="st"></div><div class="section-lbl">Keyingi 30 kunda to'lanadigan patent cheklar</div><div class="card mb-26"><div class="card-body" id="due"></div></div><div class="section-lbl">Ochiq qarzlar: nima uchun ketgan</div><div class="card mb-26"><div class="card-body" id="cat"></div></div><div class="section-lbl">6 oy ishlagach kechiladigan (kompaniya hisobiga)</div><div class="card mb-26"><div class="card-body" id="kech"></div></div></div></div></div><script src="assets/data.js"></script><script src="assets/app.js"></script><script src="assets/qn.js"></script><script>const $=i=>document.getElementById(i);
function render(){tick();bell();const a=S.ws.filter(w=>w.st!='tarix'),cat={};let open=0,kech=0;
 const pay=a.filter(w=>w.nextPay).map(w=>({w,d:w.nextPay,s:(w.tolov.length?w.tolov[w.tolov.length-1].summa:(w.steps.patent||{}).cost)||0})).sort((x,y)=>x.d>y.d?1:-1).filter(p=>left(p.d)<=30);
 a.forEach(w=>w.qarz.filter(x=>!x.yopildi).forEach(x=>{const k=x.nom.split(/[:,(]/)[0].trim();cat[k]=(cat[k]||0)+x.summa;open+=x.summa;if(x.kech)kech+=x.summa}));
 $('st').innerHTML=[[fmt(pay.reduce((s,p)=>s+p.s,0)),"30 kunlik patent to'lovi",'rust'],[fmt(open),'Ochiq qarz (jami)',''],[fmt(kech),'6 oyda kechiladigan','moss'],[a.filter(w=>w.st=='ishlamoqda').length+' / '+a.length,'Ishlayotgan / jami','']].map(x=>`<div class="stat ${x[2]}"><div class="bar"></div><div class="num" style="font-size:22px">${x[0]}</div><div class="lbl">${x[1]}</div></div>`).join('');
 $('due').innerHTML=pay.map(p=>`<div class="line"><b>${p.w.fam} ${p.w.ism}</b><span>${p.d} · taxminiy ${fmt(p.s)}</span>${chip(left(p.d),dtxt(left(p.d)))}</div>`).join('')||'<div class="empty">30 kun ichida tolov yoq</div>';
 $('cat').innerHTML=Object.keys(cat).map(k=>`<div class="line"><b>${k}</b><span>${fmt(cat[k])}</span></div>`).join('')||'<div class="empty">Qarz yoq</div>';
 $('kech').innerHTML=a.filter(w=>w.st=='ishlamoqda'&&w.qarz.some(x=>x.kech&&!x.yopildi)).map(w=>{const t=add(w.ish,6,'m');return `<div class="line"><b>${w.fam} ${w.ism}</b><span>${fmt(w.qarz.filter(x=>x.kech&&!x.yopildi).reduce((s,x)=>s+x.summa,0))} · kechiladi: ${t}</span>${chip(left(t),dtxt(left(t)))}</div>`}).join('')||'<div class="empty">Hozircha yoq</div>'}</script><script>render();demo();mountShell('ceo','xarajat','Oylik xarajatlar','Patent cheklar, qarzlar va kechiladigan xarajatlar');</script></body></html>
